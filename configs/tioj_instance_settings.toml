[tioj_instance]
sample_input = "problem[sample_testdata_attributes][%d][input]" # require: index
sample_output = "problem[sample_testdata_attributes][%d][output]" # require: index
sample_display_type = "problem[sample_testdata_attributes][%d][display_type]" # require: index
sample_destroy = "problem[sample_testdata_attributes][%d][_destroy]" # require: index
sample_destroy_regex = "^problem\\[sample_testdata_attributes\\]\\[.*\\]\\[_destroy\\]$" # regex
checker = "problem[sjcode]"
header = "problem[interlib]"
grader = "problem[interlib_impl]"
input_file = "testdatum[test_input]"
output_file = "testdatum[test_output]"
time_limit = "testdatum[time_limit]"
vss_limit = "testdatum[vss_limit]"
rss_limit = "testdatum[rss_limit]"
output_limit = "testdatum[output_limit]"
subtasks_data_td_list = "problem[subtasks_attributes][%d][td_list]" # require: index
subtasks_data_constraints = "problem[subtasks_attributes][%d][constraints]" # require: index
subtasks_data_score = "problem[subtasks_attributes][%d][score]" # require: index
banned_compilers = "problem[compiler_ids][]"
subtasks_data_destroy = "problem[subtasks_attributes][%d][_destroy]" # require: index
subtasks_data_destroy_regex = "^problem\\[subtasks_attributes\\]\\[.*\\]\\[_destroy\\]$" # regex
submission_code = "submission[code_content_attributes][code]"
submission_file = "submission[code_file]"
submission_compiler_id = "submission[compiler_id]"
compiler_list = ['cplusplus14', 'cplusplus17', 'cplusplus11', 'cplusplus98', 'c11', 'c99', 'c90', 'python2', 'python3', 'haskell', 'cplusplus20', 'c17'] # 1-base

[tioj_instance.auto_upload]
# keys should match path_settings.toml/path.auto_upload
description = "problem[description]"
input = "problem[input]"
output = "problem[output]"
hints = "problem[hint]"
source = "problem[source]"

[tioj_instance.auto_parse]
title = "problem[name]"
tag_list = "problem[tag_list]"
solution_tag_list = "problem[solution_tag_list]"
visible_state = "problem[visible_state]"
discussion_visibility = "problem[discussion_visibility]"
specjudge_type = "problem[specjudge_type]"
interlib_type = "problem[interlib_type]"
num_processes = "problem[num_stages]"
specjudge_compiler_id = "problem[specjudge_compiler_id]"
judge_between_stages = "problem[judge_between_stages]"
strict_mode = "problem[strict_mode]"
verdict_ignore_td_list = "problem[verdict_ignore_td_list]"

[tioj_instance.unsupported]
# the edit form fields that a tps directory has no place for, with the value TIOJ gives a new
# problem; download-problem warns when a problem changed one of them, since it cannot keep that
"problem[specjudge_compile_args]" = ""
"problem[_problem_prog_enabled]" = "0"
"problem[problem_prog_code]" = ""
"problem[judge_abnormally_terminated]" = "0"
"problem[default_scoring_args]" = ""
"problem[code_length_limit]" = "5000000"
"problem[ranklist_display_score]" = "0"
"problem[skip_group]" = "0"
"problem[summary_type]" = "none"
"problem[summary_code]" = ""
"problem[score_precision]" = "2"
